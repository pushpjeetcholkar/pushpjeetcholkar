<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="bt bd" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="bt">Pushpjeet Cholkar: Database, Cloud, AI/ML</title>
  <desc id="bd">Consultant, corporate trainer and researcher. 17+ years, 300+ trainings, from Oracle 8i to AI/ML.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a15"/>
      <stop offset=".55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#150f27"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".20"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".22"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="330" rx="18"/></clipPath>
    <clipPath id="term"><rect x="57" y="215" width="886" height="88" rx="9"/></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }

    /* dots travelling Data -> Cloud -> AI */
    .flow { stroke-dasharray: 2 9; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -22; } }

    /* halo behind each node, lit one after the other */
    .halo { opacity: .22; transform-box: fill-box; transform-origin: center; animation: halo 3.6s ease-in-out infinite; }
    .h2 { animation-delay: 1.2s; }
    .h3 { animation-delay: 2.4s; }
    @keyframes halo { 0%, 100% { opacity: .16; transform: scale(1); } 50% { opacity: .6; transform: scale(1.13); } }

    /* the query types itself, the result appears, then it resets */
    .type { transform: translateX(432px); animation: type 11s steps(48, end) infinite; }
    @keyframes type { 0%, 5% { transform: translateX(0); } 40%, 93% { transform: translateX(432px); } 100% { transform: translateX(0); } }
    .cursor { animation: blink 1s steps(1, end) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .result { animation: show 11s linear infinite; }
    @keyframes show { 0%, 42% { opacity: 0; } 46%, 91% { opacity: 1; } 94%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .flow, .halo, .type, .cursor, .result { animation: none; }
    }
  </style>

  <!-- background -->
  <g clip-path="url(#frame)">
    <rect width="1000" height="330" fill="url(#bg)"/>
    <rect width="1000" height="330" fill="url(#grid)"/>
    <circle cx="110" cy="10" r="270" fill="url(#glowA)"/>
    <circle cx="910" cy="330" r="300" fill="url(#glowB)"/>
  </g>
  <rect x=".5" y=".5" width="999" height="329" rx="18" fill="none" stroke="#30363d"/>

  <!-- name block -->
  <text class="mono" x="58" y="60" font-size="15" fill="#64748b">-- hello, I'm</text>
  <text class="sans" x="55" y="116" font-size="54" font-weight="800" letter-spacing="-1" fill="#f8fafc">Pushpjeet Cholkar</text>
  <text class="sans" x="58" y="155" font-size="25" font-weight="700" fill="url(#brand)">Database · Cloud · AI/ML</text>
  <text class="sans" x="58" y="185" font-size="16" fill="#94a3b8">Consultant · Corporate Trainer · Researcher</text>

  <!-- site -->
  <text class="mono" x="944" y="44" font-size="13" text-anchor="end" fill="#64748b">pushpjeet.com</text>

  <!-- pipeline: Data -> Cloud -> AI -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line class="flow" x1="712" y1="104" x2="756" y2="104" stroke="#67e8f9" stroke-width="2.6"/>
    <line class="flow" x1="828" y1="104" x2="872" y2="104" stroke="#c4b5fd" stroke-width="2.6"/>

    <!-- data -->
    <g transform="translate(676 104)" stroke="#22d3ee">
      <circle class="halo" r="33" stroke-width="2"/>
      <circle r="26" fill="#0a1220" stroke-width="1.6"/>
      <g stroke-width="1.8">
        <ellipse cy="-8" rx="10" ry="4"/>
        <path d="M-10-8V8c0 2.2 4.5 4 10 4s10-1.8 10-4V-8"/>
        <path d="M-10 0c0 2.2 4.5 4 10 4s10-1.8 10-4"/>
      </g>
    </g>

    <!-- cloud -->
    <g transform="translate(792 104)" stroke="#a78bfa">
      <circle class="halo h2" r="33" stroke-width="2"/>
      <circle r="26" fill="#0e0f22" stroke-width="1.6"/>
      <path transform="translate(-12.5 -12)" stroke-width="1.8" d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
    </g>

    <!-- ai -->
    <g transform="translate(908 104)" stroke="#f472b6">
      <circle class="halo h3" r="33" stroke-width="2"/>
      <circle r="26" fill="#150e20" stroke-width="1.6"/>
      <g stroke-width="1.1" stroke-opacity=".75">
        <path d="M-10-6 0-10M-10-6 0 0M-10-6 0 10M-10 6 0-10M-10 6 0 0M-10 6 0 10M0-10 10 0M0 0h10M0 10 10 0"/>
      </g>
      <g fill="#f472b6" stroke="none">
        <circle cx="-10" cy="-6" r="2.4"/><circle cx="-10" cy="6" r="2.4"/>
        <circle cy="-10" r="2.4"/><circle r="2.4"/><circle cy="10" r="2.4"/>
        <circle cx="10" r="2.8"/>
      </g>
    </g>
  </g>

  <g class="sans" text-anchor="middle">
    <text x="676" y="158" font-size="12" font-weight="700" letter-spacing="2.4" fill="#22d3ee">DATA</text>
    <text x="792" y="158" font-size="12" font-weight="700" letter-spacing="2.4" fill="#a78bfa">CLOUD</text>
    <text x="908" y="158" font-size="12" font-weight="700" letter-spacing="2.4" fill="#f472b6">AI</text>
    <g font-size="11.5" fill="#94a3b8">
      <text x="676" y="176">Oracle · Spark</text>
      <text x="792" y="176">AWS · Terraform</text>
      <text x="908" y="176">ML · RAG · LLMs</text>
    </g>
  </g>

  <!-- terminal -->
  <rect x="56" y="214" width="888" height="90" rx="10" fill="#060a13" stroke="#1e293b"/>
  <g clip-path="url(#term)" class="mono" font-size="15">
    <text x="74" y="243" textLength="477" fill="#e2e8f0"><tspan fill="#22d3ee">SQL&gt;</tspan> SELECT years, trainings, journey FROM pushpjeet;</text>

    <!-- cover + cursor slide right to "type" the query -->
    <g class="type">
      <rect x="119" y="227" width="460" height="22" fill="#060a13"/>
      <rect class="cursor" x="120" y="229" width="8" height="18" fill="#22d3ee"/>
    </g>

    <g class="result">
      <g fill="#64748b" font-size="13">
        <text x="74" y="268">YEARS</text>
        <text x="146" y="268">TRAININGS</text>
        <text x="254" y="268">JOURNEY</text>
      </g>
      <text x="74" y="290" fill="#22d3ee">17+</text>
      <text x="146" y="290" fill="#a78bfa">300+</text>
      <text x="254" y="290" fill="#e2e8f0">Oracle 8i → 23ai → AWS → Terraform → ML → RAG / LLMs</text>
    </g>
  </g>
</svg>
